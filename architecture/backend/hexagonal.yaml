id: hexagonal
name: Hexagonal Architecture (Ports & Adapters)
description: Explicit ports and adapters; persistence and messaging without framework-specific paths
tree:
  - domain/model
  - domain/value-object
  - domain/event
  - application/port/inbound
  - application/port/outbound
  - application/usecase
  - application/dto
  - infrastructure/adapter/inbound/http
  - infrastructure/adapter/outbound/persistence
  - infrastructure/adapter/outbound/messaging
  - infrastructure/config
